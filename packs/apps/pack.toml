[meta]
name        = "apps"
description = "GUI applications"
os          = "linux"

# --- Browsers ---

[[packages]]
name   = "zen-browser-bin"
system = "zen-browser-bin"

[[packages]]
name   = "vivaldi"
system = "vivaldi"
optional = true

[[packages]]
name   = "ungoogled-chromium-bin"
system = "ungoogled-chromium-bin"
optional = true

# --- Utilities ---

[[packages]]
name   = "gnome-calculator"
system = "gnome-calculator"

[[packages]]
name   = "gnome-clocks"
system = "gnome-clocks"

[[packages]]
name   = "loupe"
system = "loupe"

[[packages]]
name   = "pinta"
system = "pinta"

[[packages]]
name   = "zathura"
system = "zathura"
optional = true

[[packages]]
name   = "zathura-pdf-mupdf"
system = "zathura-pdf-mupdf"
optional = true

[[packages]]
name   = "pika-backup"
system = "pika-backup"
optional = true

[[packages]]
name   = "anki"
system = "anki"
optional = true

[[packages]]
name   = "aria2"
system = "aria2"
optional = true

[[packages]]
name   = "uget"
system = "uget"
optional = true

[[packages]]
name   = "wayscriber-bin"
system = "wayscriber-bin"
optional = true

[[packages]]
name   = "sqlitebrowser"
system = "sqlitebrowser"
optional = true

# --- Office / Creative ---

[[packages]]
name   = "libreoffice-fresh"
system = "libreoffice-fresh"
optional = true

[[packages]]
name   = "gimp"
system = "gimp"
optional = true

[[packages]]
name   = "krita"
system = "krita"
optional = true

[[packages]]
name   = "obsidian"
system = "obsidian"
optional = true

# --- Communication ---

[[packages]]
name   = "vesktop-bin"
system = "vesktop-bin"
optional = true

# --- Package management ---

[[packages]]
name   = "octopi"
system = "octopi"

[[packages]]
name   = "pacseek-bin"
system = "pacseek-bin"

[[packages]]
name   = "fsearch"
system = "fsearch"
optional = true

[[dotfiles]]
src = "files/.config/pacseek/config.json"
target_linux = "~/.config/pacseek/config.json"
target_mac = "~/.config/pacseek/config.json"
