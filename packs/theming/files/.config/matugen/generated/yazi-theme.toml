# : Manager [[[

[mgr]
cwd = { fg = "#f1dfdb" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#f1c147", bg = "#f1c147" }
marker_cut      = { fg = "#f8e1a6", bg = "#f8e1a6" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#dbc58c", bg = "#dbc58c" }

# Count
count_copied   = { fg = "#241a00", bg = "#f8e1a6" }
count_cut      = { fg = "#241a00", bg = "#f8e1a6" }
count_selected = { fg = "#561f12", bg = "#dbc58c" }

# Border
border_symbol = "│"
border_style  = { fg = "#ffb4a3" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#ffb4a3", bold = true, bg = "#1a110f" }
inactive  = { fg = "#e7bdb3", bg = "#1a110f" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#ffb4a3", fg = "#561f12", bold = true }
normal_alt  = { bg = "#534340", fg = "#d8c2bd" }

# Select mode
select_main = { bg = "#e7bdb3", fg = "#442a23", bold = true }
select_alt  = { bg = "#534340", fg = "#d8c2bd" }

# Unset mode
unset_main = { bg = "#dbc58c", fg = "#3c2f04", bold = true }
unset_alt  = { bg = "#534340", fg = "#d8c2bd" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "█", close = "█" }
sep_right = { open = "█", close = "█" }

# Permissions
perm_type  = { fg = "#c2583f" }
perm_write = { fg = "#9d7f31" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#edb118" }
perm_sep   = { fg = "#ff5c39" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#ffb4a3", bg = "#423734" }
progress_error  = { fg = "#ffb4ab", bg = "#423734" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#423734" }
cand = { fg = "#ffb4a3" }
rest = { fg = "#561f12" }
desc = { fg = "#f1dfdb" }
separator = " ▶ "
separator_style = { fg = "#f1dfdb" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#dbc58c" }
title_warn  = { fg = "#ffb4a3" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#ffb4a3" }
active = { fg = "#dbc58c", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#ffb4a3" }
value  = { fg = "#f1dfdb" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#ffb4a3", bg = "#561f12" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#ffb4a3" }
title   = {}
hovered = { fg = "#f8e1a6", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#f1dfdb" }
run    = { fg = "#f1dfdb" }
footer = { fg = "#442a23", bg = "#e7bdb3" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#f1dfdb" },
    { url = "*/", fg = "#ffb4a3" },
]

# : ]]]
