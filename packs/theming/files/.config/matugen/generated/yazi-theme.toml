# : Manager [[[

[mgr]
cwd = { fg = "#e2e3d8" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#6bd6cd", bg = "#6bd6cd" }
marker_cut      = { fg = "#bbece8", bg = "#bbece8" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#a0d0cc", bg = "#a0d0cc" }

# Count
count_copied   = { fg = "#00201e", bg = "#bbece8" }
count_cut      = { fg = "#00201e", bg = "#bbece8" }
count_selected = { fg = "#1f3701", bg = "#a0d0cc" }

# Border
border_symbol = "│"
border_style  = { fg = "#b1d18a" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#b1d18a", bold = true, bg = "#12140e" }
inactive  = { fg = "#bfcbad", bg = "#12140e" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#b1d18a", fg = "#1f3701", bold = true }
normal_alt  = { bg = "#44483d", fg = "#c5c8ba" }

# Select mode
select_main = { bg = "#bfcbad", fg = "#2a331e", bold = true }
select_alt  = { bg = "#44483d", fg = "#c5c8ba" }

# Unset mode
unset_main = { bg = "#a0d0cc", fg = "#003735", bold = true }
unset_alt  = { bg = "#44483d", fg = "#c5c8ba" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "█", close = "█" }
sep_right = { open = "█", close = "█" }

# Permissions
perm_type  = { fg = "#748857" }
perm_write = { fg = "#47908a" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#43cbc0" }
perm_sep   = { fg = "#84cf29" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#b1d18a", bg = "#383a32" }
progress_error  = { fg = "#ffb4ab", bg = "#383a32" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#383a32" }
cand = { fg = "#b1d18a" }
rest = { fg = "#1f3701" }
desc = { fg = "#e2e3d8" }
separator = " ▶ "
separator_style = { fg = "#e2e3d8" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#a0d0cc" }
title_warn  = { fg = "#b1d18a" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#b1d18a" }
active = { fg = "#a0d0cc", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#b1d18a" }
value  = { fg = "#e2e3d8" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#b1d18a", bg = "#1f3701" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#b1d18a" }
title   = {}
hovered = { fg = "#bbece8", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e2e3d8" }
run    = { fg = "#e2e3d8" }
footer = { fg = "#2a331e", bg = "#bfcbad" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#e2e3d8" },
    { url = "*/", fg = "#b1d18a" },
]

# : ]]]
