# : Manager [[[

[mgr]
cwd = { fg = "#dee3e5" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#7787ff", bg = "#7787ff" }
marker_cut      = { fg = "#dde1ff", bg = "#dde1ff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#bec4eb", bg = "#bec4eb" }

# Count
count_copied   = { fg = "#131a37", bg = "#dde1ff" }
count_cut      = { fg = "#131a37", bg = "#dde1ff" }
count_selected = { fg = "#003640", bg = "#bec4eb" }

# Border
border_symbol = "│"
border_style  = { fg = "#84d2e6" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#84d2e6", bold = true, bg = "#0f1416" }
inactive  = { fg = "#b2cbd2", bg = "#0f1416" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#84d2e6", fg = "#003640", bold = true }
normal_alt  = { bg = "#3f484b", fg = "#bfc8cb" }

# Select mode
select_main = { bg = "#b2cbd2", fg = "#1d343a", bold = true }
select_alt  = { bg = "#3f484b", fg = "#bfc8cb" }

# Unset mode
unset_main = { bg = "#bec4eb", fg = "#282f4d", bold = true }
unset_alt  = { bg = "#3f484b", fg = "#bfc8cb" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "█", close = "█" }
sep_right = { open = "█", close = "█" }

# Permissions
perm_type  = { fg = "#578794" }
perm_write = { fg = "#495ac7" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#445aff" }
perm_sep   = { fg = "#12ccff" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#84d2e6", bg = "#343a3c" }
progress_error  = { fg = "#ffb4ab", bg = "#343a3c" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#343a3c" }
cand = { fg = "#84d2e6" }
rest = { fg = "#003640" }
desc = { fg = "#dee3e5" }
separator = " ▶ "
separator_style = { fg = "#dee3e5" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#bec4eb" }
title_warn  = { fg = "#84d2e6" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#84d2e6" }
active = { fg = "#bec4eb", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#84d2e6" }
value  = { fg = "#dee3e5" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#84d2e6", bg = "#003640" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#84d2e6" }
title   = {}
hovered = { fg = "#dde1ff", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#dee3e5" }
run    = { fg = "#dee3e5" }
footer = { fg = "#1d343a", bg = "#b2cbd2" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { name = "*", is = "orphan", bg = "#93000a" },
    { name = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dee3e5" },
    { url = "*/", fg = "#84d2e6" },
]

# : ]]]
