[meta]
name        = "git"
description = "Git version control toolchain"
os          = "any"

[[packages]]
name   = "git"
system = "git"

[[packages]]
name   = "git-delta"
system = "git-delta"

[[packages]]
name   = "lazygit"
system = "lazygit"
optional = true

[[packages]]
name   = "github-desktop"
system = "github-desktop"
optional = true

[[dotfiles]]
src = "files/.config/lazygit/config.yml"
target_linux = "~/.config/lazygit/config.yml"
target_mac = "~/.config/lazygit/config.yml"

[[dotfiles]]
src = "files/.config/git"
target_linux = "~/.config/git"
target_mac = "~/.config/git"

