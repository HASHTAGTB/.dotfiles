[meta]
name        = "arch"
description = "CachyOS-exclusive packages not present in standard Arch repos"
os          = "linux"

# --- Kernel ---

[[packages]]
name   = "linux-firmware"
system = "linux-firmware"

[[packages]]
name   = "linux-cachyos"
system = "linux-cachyos"
optional = true

[[packages]]
name   = "linux-cachyos-headers"
system = "linux-cachyos-headers"
optional = true

[[packages]]
name   = "linux-cachyos-lts"
system = "linux-cachyos-lts"
optional = true

[[packages]]
name   = "linux-cachyos-lts-headers"
system = "linux-cachyos-lts-headers"
optional = true

[[packages]]
name   = "scx-scheds"
system = "scx-scheds"
optional = true

# --- Performance ---

[[packages]]
name   = "ananicy-cpp"
system = "ananicy-cpp"
optional = true

[[packages]]
name   = "cachyos-settings"
system = "cachyos-settings"
optional = true

# --- Pacman / Repo ---

[[packages]]
name   = "cachyos-keyring"
system = "cachyos-keyring"
optional = true

[[packages]]
name   = "cachyos-mirrorlist"
system = "cachyos-mirrorlist"
optional = true

[[packages]]
name   = "cachyos-v3-mirrorlist"
system = "cachyos-v3-mirrorlist"
optional = true

[[packages]]
name   = "cachyos-v4-mirrorlist"
system = "cachyos-v4-mirrorlist"
optional = true

[[packages]]
name   = "cachyos-hooks"
system = "cachyos-hooks"
optional = true

[[packages]]
name   = "cachyos-rate-mirrors"
system = "cachyos-rate-mirrors"
optional = true

[[packages]]
name   = "pacman-contrib"
system = "pacman-contrib"

[[packages]]
name   = "rebuild-detector"
system = "rebuild-detector"
optional = true

# --- Tooling ---

[[packages]]
name   = "cachyos-hello"
system = "cachyos-hello"
optional = true

[[packages]]
name   = "cachyos-kernel-manager"
system = "cachyos-kernel-manager"
optional = true

[[packages]]
name   = "cachyos-packageinstaller"
system = "cachyos-packageinstaller"
optional = true

[[packages]]
name   = "cachyos-snapper-support"
system = "cachyos-snapper-support"
optional = true

[[packages]]
name = "base-devel"
system = "base-devel"

# --- Bootloader ---

[[packages]]
name   = "limine"
system = "limine"
optional = true

[[packages]]
name   = "limine-mkinitcpio-hook"
system = "limine-mkinitcpio-hook"
optional = true

[[packages]]
name   = "limine-snapper-sync"
system = "limine-snapper-sync"
optional = true

[[packages]]
name   = "efibootmgr"
system = "efibootmgr"
optional = true

[[packages]]
name   = "efitools"
system = "efitools"
optional = true

[[packages]]
name   = "os-prober"
system = "os-prober"
optional = true

[[scripts]]
name = "Enable CachyOS system services"
file = "scripts/enable-arch-services.sh"
when = "post_packages"

[[scripts]]
name = "Switch pacman repos (Arch ↔ CachyOS)"
file = "scripts/switch-repos.sh"
when = "post_packages"
