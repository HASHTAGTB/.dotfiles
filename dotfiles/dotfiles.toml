[dotfiles]

# ── Zsh ───────────────────────────────────────────────────────────────────────
zshrc            = { path = ".zshrc",                        tags = ["zsh"] }
zshenv           = { path = ".zshenv",                       tags = ["zsh"] }
p10k             = { path = ".p10k.zsh",                     tags = ["zsh"] }
zsh-custom       = { path = ".oh-my-zsh/custom",             tags = ["zsh"] , opt = true }
shell-config     = { path = ".config/shell",                 tags = ["zsh"] }

# ── Hyprland ──────────────────────────────────────────────────────────────────
hypr             = { path = ".config/hypr",                  tags = ["hyprland"] }
swappy           = { path = ".config/swappy",                tags = ["hyprland"] }
swaync           = { path = ".config/swaync",                tags = ["hyprland"] }
wlogout          = { path = ".config/wlogout",               tags = ["hyprland"] }
waybar           = { path = ".config/waybar",                tags = ["hyprland"] }
waypaper         = { path = ".config/waypaper",              tags = ["hyprland"] }
scripts          = { path = "scripts",                       tags = ["hyprland"] }
wallpapers       = { path = "img/wallpapers",                tags = ["hyprland"] }
app-shortcuts    = { path = ".local/share/applications/custom", tags = ["hyprland"] }

# ── Wayland ───────────────────────────────────────────────────────────────────
rofi             = { path = ".config/rofi",                  tags = ["wayland"] }
uwsm             = { path = ".config/uwsm",                  tags = ["wayland"] }
xdg-portal       = { path = ".config/xdg-desktop-portal",   tags = ["wayland"] }
xdg-portal-term  = { path = ".config/xdg-desktop-portal-termfilechooser", tags = ["wayland"] }

# ── Neovim ────────────────────────────────────────────────────────────────────
nvim             = { path = ".config/nvim",                  tags = ["nvim"] }
nvim-lazyvim     = { path = ".config/nvim.lazyvim",          tags = ["nvim"] }
nvim-own         = { path = ".config/nvim.own",              tags = ["nvim"] }

# ── Terminal tools ────────────────────────────────────────────────────────────
tmux             = { path = ".config/tmux",                  tags = ["terminal-tools"] }
btop             = { path = ".config/btop/btop.conf",        tags = ["terminal-tools"] }
fastfetch        = { path = ".config/fastfetch",             tags = ["terminal-tools"] }

# ── Kitty ─────────────────────────────────────────────────────────────────────
kitty            = { path = ".config/kitty/kitty.conf",      tags = ["kitty"] }

# ── Yazi ──────────────────────────────────────────────────────────────────────
yazi             = { path = ".config/yazi",                  tags = ["yazi"] }

# ── Git ───────────────────────────────────────────────────────────────────────
git-config       = { path = ".config/git",                   tags = ["git"] }
lazygit          = { path = ".config/lazygit/config.yml",    tags = ["git"] }

# ── Theming ───────────────────────────────────────────────────────────────────
matugen          = { path = ".config/matugen",               tags = ["theming"] }
gtk2             = { path = ".gtkrc-2.0",                    tags = ["theming"] }
gtk3-settings    = { path = ".config/gtk-3.0/settings.ini", tags = ["theming"] }
gtk4             = { path = ".config/gtk-4.0",               tags = ["theming"] }
qt5ct-conf       = { path = ".config/qt5ct/qt5ct.conf",      tags = ["theming"] }
qt5ct-colors     = { path = ".config/qt5ct/style-colors.conf", tags = ["theming"] }
qt6ct-conf       = { path = ".config/qt6ct/qt6ct.conf",      tags = ["theming"] }
qt6ct-colors     = { path = ".config/qt6ct/style-colors.conf", tags = ["theming"] }
xsettingsd       = { path = ".config/xsettingsd/xsettingsd.conf", tags = ["theming"] }

# ── Thunar ────────────────────────────────────────────────────────────────────
gtk3-bookmarks   = { path = ".config/gtk-3.0/bookmarks",    tags = ["thunar"] }
gtk3-thunar-css  = { path = ".config/gtk-3.0/thunar.css",   tags = ["thunar"] }

# ── Media ─────────────────────────────────────────────────────────────────────
mpv              = { path = ".config/mpv",                   tags = ["media"] }
spicetify        = { path = ".config/spicetify",             tags = ["media"] }

# ── Gaming ────────────────────────────────────────────────────────────────────
mangohud         = { path = ".config/MangoHud/MangoHud.conf", tags = ["gaming"] }

# ── Apps ──────────────────────────────────────────────────────────────────────
pacseek          = { path = ".config/pacseek/config.json",   tags = ["apps"] }
vesktop          = { path = ".config/vesktop-flags.conf",    tags = ["apps"] }

# ── System ────────────────────────────────────────────────────────────────────
systemd-user     = { path = ".config/systemd/user",          tags = ["system"] }
pipewire         = { path = ".config/pipewire/pipewire.conf.d", tags = ["system"] }
fontconfig       = { path = ".config/fontconfig",            tags = ["system"] }
mimeapps         = { path = ".config/mimeapps.list",         tags = ["system"] }
xdg-terminals    = { path = ".config/xdg-terminals.list",    tags = ["system"] }
user-dirs        = { path = ".config/user-dirs.dirs",        tags = ["system"] }
easyeffects      = { path = ".config/easyeffects/db",        tags = ["system"], opt = true }
input-remapper   = { path = ".config/input-remapper-2",      tags = ["system"], opt = true }
qmk = { path = ".config/qmk/qmk.ini", tags = ["keyboard"] }
