[dotfiles]

# ── Zsh ───────────────────────────────────────────────────────────────────────
zshrc            = { path = ".zshrc", priority = "essential" }
zshenv           = { path = ".zshenv", priority = "useless" }
p10k             = { path = ".p10k.zsh", priority = "essential" }
zsh-custom       = { path = ".oh-my-zsh/custom", priority = "useless" }
shell-config     = { path = ".config/shell", priority = "essential" }

# ── Hyprland ──────────────────────────────────────────────────────────────────
hypr             = { path = ".config/hypr", priority = "essential" }
swappy           = { path = ".config/swappy", priority = "high" }
swaync           = { path = ".config/swaync", priority = "high" }
wlogout          = { path = ".config/wlogout", priority = "high" }
waybar           = { path = ".config/waybar", priority = "high" }
waypaper         = { path = ".config/waypaper", priority = "medium" }
scripts          = { path = "scripts", priority = "essential" }
wallpapers       = { path = "img/wallpapers", priority = "essential" }
app-shortcuts    = { path = ".local/share/applications/custom" }

# ── Wayland ───────────────────────────────────────────────────────────────────
rofi             = { path = ".config/rofi", priority = "essential" }
uwsm             = { path = ".config/uwsm", priority = "essential" }
xdg-portal       = { path = ".config/xdg-desktop-portal", priority = "medium" }
xdg-portal-term  = { path = ".config/xdg-desktop-portal-termfilechooser", priority = "useless" }

# ── Neovim ────────────────────────────────────────────────────────────────────
nvim             = { path = ".config/nvim", priority = "essential" }

# ── Terminal tools ────────────────────────────────────────────────────────────
tmux             = { path = ".config/tmux", priority = "essential" }
btop             = { path = ".config/btop" }
fastfetch        = { path = ".config/fastfetch" }

# ── Kitty ─────────────────────────────────────────────────────────────────────
kitty            = { path = ".config/kitty", priority = "essential" }

# ── Yazi ──────────────────────────────────────────────────────────────────────
yazi             = { path = ".config/yazi", priority = "essential" }

# ── Git ───────────────────────────────────────────────────────────────────────
git-config       = { path = ".config/git", priority = "essential" }
lazygit          = { path = ".config/lazygit", priority = "useless" }

# ── Theming ───────────────────────────────────────────────────────────────────
matugen          = { path = ".config/matugen", priority = "high" }
gtk2             = { path = ".gtkrc-2.0", priority = "high" }
gtk4             = { path = ".config/gtk-4.0", priority = "high" }
qt5ct            = { path = ".config/qt5ct", priority = "high" }
qt6ct            = { path = ".config/qt6ct", priority = "high" }
xsettingsd       = { path = ".config/xsettingsd", priority = "high" }

# ── Media ─────────────────────────────────────────────────────────────────────
mpv              = { path = ".config/mpv", priority = "medium" }
spicetify        = { path = ".config/spicetify", priority = "medium" }

# ── Gaming ────────────────────────────────────────────────────────────────────
mangohud         = { path = ".config/MangoHud", priority = "medium" }

# ── Apps ──────────────────────────────────────────────────────────────────────
pacseek          = { path = ".config/pacseek", priority = "medium" }
vesktop          = { path = ".config/vesktop-flags.conf" }

# ── System ────────────────────────────────────────────────────────────────────
systemd-user     = { path = ".config/systemd/user", priority = "high" }
pipewire         = { path = ".config/pipewire", priority = "essential" }
fontconfig       = { path = ".config/fontconfig", priority = "useless" }
mimeapps         = { path = ".config/mimeapps.list", priority = "medium" }
xdg-terminals    = { path = ".config/xdg-terminals.list", priority = "medium" }
user-dirs        = { path = ".config/user-dirs.dirs", priority = "medium" }
easyeffects      = { path = ".config/easyeffects", priority = "useless" }
input-remapper   = { path = ".config/input-remapper-2", priority = "useless" }
qmk = { path = ".config/qmk" }
gtk3 = { path = ".config/gtk-3.0", priority = "high" }
