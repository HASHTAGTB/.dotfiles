# : Manager [[[

[mgr]
cwd = { fg = "#dee4e1" }

# Find
find_keyword  = { fg = "#ffb4ab", bold = true, italic = true, underline = true }
find_position = { fg = "#ffb4ab", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#63b7ff", bg = "#63b7ff" }
marker_cut      = { fg = "#c9e6ff", bg = "#c9e6ff" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#abcae4", bg = "#abcae4" }

# Count
count_copied   = { fg = "#001e2f", bg = "#c9e6ff" }
count_cut      = { fg = "#001e2f", bg = "#c9e6ff" }
count_selected = { fg = "#00382f", bg = "#abcae4" }

# Border
border_symbol = "│"
border_style  = { fg = "#84d6c3" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "█", close = "█" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#84d6c3", bold = true, bg = "#0e1513" }
inactive  = { fg = "#b1ccc4", bg = "#0e1513" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#84d6c3", fg = "#00382f", bold = true }
normal_alt  = { bg = "#3f4946", fg = "#bec9c5" }

# Select mode
select_main = { bg = "#b1ccc4", fg = "#1d352f", bold = true }
select_alt  = { bg = "#3f4946", fg = "#bec9c5" }

# Unset mode
unset_main = { bg = "#abcae4", fg = "#123348", bold = true }
unset_alt  = { bg = "#3f4946", fg = "#bec9c5" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "█", close = "█" }
sep_right = { open = "█", close = "█" }

# Permissions
perm_type  = { fg = "#5a8a7c" }
perm_write = { fg = "#3c81ba" }
perm_read  = { fg = "#ff2b12" }
perm_exec  = { fg = "#309fff" }
perm_sep   = { fg = "#1edbaf" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#84d6c3", bg = "#343b38" }
progress_error  = { fg = "#ffb4ab", bg = "#343b38" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#343b38" }
cand = { fg = "#84d6c3" }
rest = { fg = "#00382f" }
desc = { fg = "#dee4e1" }
separator = " ▶ "
separator_style = { fg = "#dee4e1" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#abcae4" }
title_warn  = { fg = "#84d6c3" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#84d6c3" }
active = { fg = "#abcae4", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#84d6c3" }
value  = { fg = "#dee4e1" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#84d6c3", bg = "#00382f" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#84d6c3" }
title   = {}
hovered = { fg = "#c9e6ff", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#dee4e1" }
run    = { fg = "#dee4e1" }
footer = { fg = "#1d352f", bg = "#b1ccc4" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#94e2d5" },

    # Media
    { mime = "{audio,video}/*", fg = "#f9e2af" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f5c2e7" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffdad6" },

    # Fallback
    { url = "*", fg = "#dee4e1" },
    { url = "*/", fg = "#84d6c3" },
]

# : ]]]
